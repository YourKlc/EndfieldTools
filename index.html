<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方格选择工具</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yourname/repo@main/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/YourKlc/EndfieldTools@main/style.css"></head><body><div class="main-container"><h1 class="text-center mb-4"><i class="bi bi-grid-3x3-gap-fill text-success"></i> 方格选择工具</h1><div class="text-center mb-3"><button id="addPatternBtn" class="btn btn-success"><i class="bi bi-plus-circle"></i> 添加自定义图案</button></div><div class="pattern-panel"><h5 class="mb-3"><i class="bi bi-palette-fill text-success"></i> 图案库 <small class="text-muted">(拖拽到下方网格中使用)</small></h5><div class="pattern-library" id="patternLibrary"></div><div class="selection-tip"><small>提示：白色格子 - 保持主网格原状，绿色格子 - 选中主网格，黑色格子 - 锁定主网格（通过锁定模式绘制）</small></div></div><div class="row"><div class="col-lg-8"><div class="grid-container"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">主网格</h5><div class="d-flex align-items-center"><small class="text-muted">已选择: <span id="selectedCount" class="fw-bold">0</span>/<span id="totalCount">100</span></small><div id="modeIndicator" class="mode-indicator mode-normal">普通模式</div></div></div><div id="dropHint" class="drop-hint"><div class="hint-text"><i class="bi bi-arrow-down-square-fill display-4 text-success"></i><div>将图案拖放到此处</div><small class="text-muted">释放鼠标以放置图案</small></div></div><div id="grid" class="grid"></div><div class="d-flex justify-content-between mt-3"><div><small class="text-muted">尺寸: <span id="gridSize">10×10</span></small></div><div><small class="text-muted">使用说明: 单击/长按滑动反转格子，开启锁定模式后滑动绘制黑色格子</small></div></div></div></div><div class="col-lg-4"><div class="stats-card"><div class="row text-center"><div class="col-4"><div class="stats-number" id="statsSelected">0</div><div class="stats-label">已选格子</div></div><div class="col-4"><div class="stats-number" id="statsBlocked">0</div><div class="stats-label">锁定格子</div></div><div class="col-4"><div class="stats-number" id="statsPatterns">0</div><div class="stats-label">使用图案</div></div></div></div><div class="control-panel"><h5 class="mb-3">控制面板</h5><div class="mb-4"><label class="form-label fw-bold">绘制模式:</label><div class="d-grid gap-2 mb-3"><button id="normalModeBtn" class="btn btn-success active"><i class="bi bi-pencil"></i> 普通模式 <small class="d-block mt-1">单击/滑动反转格子</small></button> <button id="lockModeBtn" class="btn btn-outline-secondary lock-mode-btn"><i class="bi bi-lock"></i> 锁定模式 <small class="d-block mt-1">单击/滑动绘制黑色格子</small></button></div></div><div class="mb-4"><label class="form-label fw-bold">网格设置:</label><div class="mb-3"><label for="rows" class="form-label">行数: <span id="rowsValue" class="slider-value">10</span></label> <input type="range" class="form-range cell-size-slider" id="rows" min="5" max="30" value="10"></div><div class="mb-3"><label for="cols" class="form-label">列数: <span id="colsValue" class="slider-value">10</span></label> <input type="range" class="form-range cell-size-slider" id="cols" min="5" max="30" value="10"></div><div class="mb-3"><label for="cellSize" class="form-label">格子大小: <span id="cellSizeValue" class="slider-value">30</span>px</label> <input type="range" class="form-range cell-size-slider" id="cellSize" min="20" max="60" value="30"></div></div><div class="mb-4"><label class="form-label fw-bold">图案设置:</label><div class="mb-3"><label for="patternOpacity" class="form-label">预览透明度: <span id="patternOpacityValue" class="slider-value">70</span>%</label> <input type="range" class="form-range cell-size-slider" id="patternOpacity" min="20" max="90" value="70"></div><div class="form-check"><input class="form-check-input" type="checkbox" id="snapToGrid" checked> <label class="form-check-label" for="snapToGrid">对齐网格</label></div></div><div class="operation-buttons mb-4"><button id="selectAll" class="btn btn-success"><i class="bi bi-check-all"></i> 全选</button> <button id="clearAll" class="btn btn-outline-danger"><i class="bi bi-trash"></i> 清空</button><div class="btn-group"><button id="invertSelection" class="btn btn-outline-secondary"><i class="bi bi-arrow-left-right"></i> 反选</button> <button id="clearPatterns" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> 清除图案</button></div><button id="clearLocks" class="btn btn-outline-dark"><i class="bi bi-unlock"></i> 清除所有锁定</button></div><div class="mb-3"><label class="form-label fw-bold">导出选项:</label><div class="d-grid gap-2"><div class="btn-group"><button id="exportIndices" class="btn btn-outline-success"><i class="bi bi-list-ol"></i> 导出索引</button> <button id="exportMatrix" class="btn btn-outline-success"><i class="bi bi-table"></i> 导出矩阵</button></div></div></div></div></div></div><div class="output-panel"><div class="d-flex justify-content-between align-items-center mb-2"><h5 class="mb-0">输出结果</h5><button id="clearOutput" class="btn btn-sm btn-outline-secondary"><i class="bi bi-trash"></i> 清空</button></div><pre id="output" class="mb-0" style="min-height:120px;max-height:200px;overflow:auto;font-size:.85rem"></pre></div></div><div class="modal fade" id="patternEditorModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="bi bi-plus-circle text-success"></i> 添加自定义图案</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div class="mb-3"><label for="patternName" class="form-label">图案名称</label> <input class="form-control" id="patternName" placeholder="例如: 我的图案"></div><div class="mb-4"><label class="form-label">当前颜色:</label><div class="color-selector"><div class="color-option"><div id="colorWhiteBtn" class="color-btn color-white active" data-color="white"></div><div class="color-label">白色<br>(保持原状)</div></div><div class="color-option"><div id="colorGreenBtn" class="color-btn color-green" data-color="green"></div><div class="color-label">绿色<br>(选中格子)</div></div></div></div><div class="row mb-3"><div class="col-6"><label for="editorRows" class="form-label">行数: <span id="editorRowsValue">5</span></label> <input type="range" class="form-range" id="editorRows" min="1" max="10" value="5"></div><div class="col-6"><label for="editorCols" class="form-label">列数: <span id="editorColsValue">5</span></label> <input type="range" class="form-range" id="editorCols" min="1" max="10" value="5"></div></div><div class="mb-3"><label class="form-label">图案设计</label><div class="d-flex align-items-center mb-2"><small class="text-muted me-3">点击格子设置颜色</small><div class="d-flex align-items-center me-3"><div class="editor-cell white me-1"></div><small>白色</small></div><div class="d-flex align-items-center me-3"><div class="editor-cell green me-1"></div><small>绿色</small></div></div><div id="patternEditor" class="custom-pattern-editor"></div></div><div class="alert alert-info" role="alert"><small><i class="bi bi-info-circle"></i> 提示：白色格子保持主网格原状，绿色格子选中主网格对应格子。</small></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button> <button type="button" id="clearEditorBtn" class="btn btn-outline-secondary">清空</button> <button type="button" id="savePatternBtn" class="btn btn-success">保存图案</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/gh/YourKlc/EndfieldTools@main/script.js"></script></body></html>
